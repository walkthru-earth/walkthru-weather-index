[project]
name = "walkthru-weather-index"
version = "0.1.0"
description = "NOAA AI-NWP weather forecasts downscaled to H3-indexed GeoParquet"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.42.73",
    "obstore>=0.9.2",
    "duckdb==1.5.1",
    "h3>=4.4.2",
    "h5netcdf>=1.8.1",
    "h5py>=3.16.0",
    "huggingface-hub>=1.7.2",
    "numpy>=2.4.3",
    "odc-stac>=0.5.2",
    "pandas>=3.0.1",
    "planetary-computer>=1.0.0",
    "pyarrow>=23.0.1",
    "pystac-client>=0.9.0",
    "scipy>=1.17.1",
    "xarray>=2026.2.0",
]

[project.optional-dependencies]
gpu = ["cupy-cuda12x>=13.0"]

[dependency-groups]
dev = ["pre-commit>=4.5.1", "ruff>=0.15.7"]
