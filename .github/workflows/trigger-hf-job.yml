name: Run pipeline on HuggingFace Jobs

on:
  workflow_dispatch:
    inputs:
      noaa_file:
        description: "NOAA S3 key (e.g. GRAP_v100_GFS/2024/01/01/file.nc)"
        required: false
        default: ""
      model:
        description: "Model name"
        required: false
        default: "GraphCast_GFS"
      h3_resolutions:
        description: "Comma-separated H3 resolutions (e.g. 5,7)"
        required: false
        default: "5"
      bbox:
        description: "Bounding box: min_lat,max_lat,min_lon,max_lon (empty = global)"
        required: false
        default: ""
      flavor:
        description: "HF Jobs hardware flavor"
        required: false
        default: "a10g-small"

jobs:
  run-hf-job:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Submit HuggingFace Job
        run: uv run python scripts/submit_hf_job.py
        env:
          HF_TOKEN:              ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID:           "yharby/walkthru-weather-index"
          HF_JOB_FLAVOR:         ${{ inputs.flavor }}
          NOAA_FILE:             ${{ inputs.noaa_file }}
          MODEL_NAME:            ${{ inputs.model }}
          H3_RESOLUTIONS:        ${{ inputs.h3_resolutions }}
          BBOX:                  ${{ inputs.bbox }}
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    ${{ secrets.AWS_DEFAULT_REGION }}
          S3_BUCKET:             ${{ secrets.S3_BUCKET }}
          S3_PREFIX:             ${{ secrets.S3_PREFIX }}
