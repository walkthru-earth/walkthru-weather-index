name: 🔍 Detect new NOAA MLWP data

on:
  schedule:
    # NOAA updates at ~00Z and ~12Z — check 75 min after each
    - cron: "15 1  * * *"
    - cron: "15 13 * * *"
  workflow_dispatch:
    inputs:
      force_run:
        description: "Force pipeline run even if no new file"
        type: boolean
        default: false

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to commit state file
      actions:  write   # to dispatch pipeline workflow

    steps:
      - uses: actions/checkout@v4

      # AWS CLI is pre-installed on ubuntu-latest — no extra install needed.
      # noaa-oar-mlwp-data is a public bucket — --no-sign-request skips auth.

      - name: List all AI model prefixes on NOAA S3
        id: list
        run: |
          declare -A MODELS=(
            [GraphCast_GFS]="GRAP_v100_GFS"
            [GraphCast_IFS]="GRAP_v100_IFS"
            [FourCastNet]="FOUR_v200_GFS"
            [Pangu_Weather]="PANG_v100_GFS"
          )

          rm -f /tmp/current_all.txt

          for MODEL in "${!MODELS[@]}"; do
            PREFIX="${MODELS[$MODEL]}"
            aws s3 ls "s3://noaa-oar-mlwp-data/${PREFIX}/" \
              --recursive \
              --no-sign-request \
              2>/dev/null \
              | awk -v p="$PREFIX" '{print p"/"$4}' \
              >> /tmp/current_all.txt || true
          done

          sort /tmp/current_all.txt -o /tmp/current_all.txt
          LATEST=$(tail -1 /tmp/current_all.txt)
          echo "latest=$LATEST" >> $GITHUB_OUTPUT
          echo "Latest file on S3: $LATEST"

      - name: Compare with last-seen state
        id: check
        run: |
          LAST=$(cat state/noaa-last-seen.txt 2>/dev/null | tr -d '[:space:]')
          LATEST="${{ steps.list.outputs.latest }}"

          echo "Last seen : '$LAST'"
          echo "Latest    : '$LATEST'"

          if [ "$LAST" = "$LATEST" ] && [ "${{ inputs.force_run }}" != "true" ]; then
            echo "new=false" >> $GITHUB_OUTPUT
            echo "✅ No new files — nothing to do."
          else
            echo "new=true"         >> $GITHUB_OUTPUT
            echo "latest=$LATEST"   >> $GITHUB_OUTPUT
            echo "🆕 New file detected: $LATEST"
          fi

      - name: Update state file
        if: steps.check.outputs.new == 'true'
        run: |
          echo "${{ steps.check.outputs.latest }}" > state/noaa-last-seen.txt
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/noaa-last-seen.txt
          git commit -m "chore: update NOAA last-seen state [skip ci]"
          git push

      - name: Trigger pipeline
        if: steps.check.outputs.new == 'true'
        run: |
          gh workflow run trigger-hf-job.yml \
            --field noaa_file="${{ steps.check.outputs.latest }}" \
            --field model="GraphCast_GFS"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
